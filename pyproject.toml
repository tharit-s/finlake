[project]
name = "finlake"
version = "0.1.0"
description = "Mini financial-transactions data lake: medallion architecture (bronze/silver/gold) with uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "ruff>=0.5",
    "matplotlib>=3.11.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finlake"]
